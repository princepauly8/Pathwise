<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pathwise — AI Study Companion</title>
    <meta
      name="description"
      content="Personalized AI study companion generating class-calibrated learning paths, interactive lessons, adaptive quizzes, and Socratic tutoring for each student's selected subjects."
    />
    <meta property="og:title" content="Pathwise — AI Study Companion" />
    <meta
      property="og:description"
      content="Personalized AI study companion generating class-calibrated learning paths, interactive lessons, adaptive quizzes, and Socratic tutoring for each student's selected subjects."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('pathwise_theme_v1');
          var isDark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.dataset.theme = 'dark';
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.dataset.theme = 'light';
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--pw-bg)] text-[var(--pw-text)] antialiased selection:bg-[#0284C7]/15 dark:selection:bg-sky-400/25 selection:text-[var(--pw-text)]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
